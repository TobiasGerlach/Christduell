name: Backend Deploy (Azure)

# Builds the backend container image, pushes it to Azure Container Registry,
# and deploys it to an Azure Web App for Containers.
#
# One-time setup required before this workflow can run:
#   1. Create an Azure Container Registry (ACR) and an Azure Web App
#      configured for a custom container.
#   2. Create a Microsoft Entra service principal with rights to push to the
#      registry and deploy to the web app, and store its JSON credentials in
#      the repo secret AZURE_CREDENTIALS (az ad sp create-for-rbac --sdk-auth).
#   3. Add repo secrets/variables:
#        AZURE_CREDENTIALS        - service principal JSON for azure/login
#        ACR_LOGIN_SERVER         - e.g. christduell.azurecr.io
#        ACR_USERNAME / ACR_PASSWORD - ACR admin credentials (or use OIDC)
#        AZURE_WEBAPP_NAME        - name of the target Web App

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/christduell-backend:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/christduell-backend:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/christduell-backend:${{ github.sha }}
