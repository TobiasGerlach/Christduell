name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint, tests, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Production runs Postgres; the suite runs against both so a
      # SQLite-only construct cannot reach a deployment. A boolean default of
      # `0` in a migration passed on SQLite and broke on Postgres exactly once.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: christduell
          POSTGRES_PASSWORD: christduell
          POSTGRES_DB: christduell_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test (SQLite)
        run: uv run pytest -q

      - name: Test (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://christduell:christduell@localhost:5432/christduell_test
        run: uv run pytest -q

      - name: Migrations apply to Postgres
        env:
          DATABASE_URL: postgresql+psycopg://christduell:christduell@localhost:5432/christduell_migrations
        run: |
          uv run python -c "
          import psycopg
          with psycopg.connect('postgresql://christduell:christduell@localhost:5432/postgres', autocommit=True) as c:
              c.execute('create database christduell_migrations')
          "
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Check for missing migrations
        # Fails when the models have moved on without a matching Alembic revision.
        env:
          DATABASE_URL: sqlite:///./ci-check.db
        run: |
          uv run alembic upgrade head
          uv run alembic check

  frontend:
    name: Frontend (typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  infra:
    name: Infra (terraform validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate
